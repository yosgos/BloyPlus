<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הוספת חבר משפחה</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: white;
            box-sizing: border-box;
        }
        h2 { text-align: center; margin-bottom: 20px; font-weight: 400; }
        label { font-size: 14px; color: #ccc; display: block; margin-top: 14px; }
        
        input, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 4px 0;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }
        select option {
            background: #203a43;
            color: white;
        }
        input:focus, select:focus { outline: none; border-color: #4ed17d; }
        
        .gender-container {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }
        .gender-option {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .gender-option input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        .gender-option:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .gender-option:focus-within {
            border-color: #4ed17d;
            background: rgba(78, 209, 125, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #4ed17d;
            border: none;
            border-radius: 6px;
            color: #0f2027;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 24px;
        }
        button[type="submit"]:hover { background: #3db86b; transform: translateY(-1px); }
        button[type="submit"]:disabled { background: #555; cursor: not-allowed; color: #aaa; }
        #statusMessage { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="form-box">
    <h2>הוספת חבר משפחה</h2>
    <form id="familyForm">
        <label>שם פרטי *</label>
        <input type="text" id="first_name" required autocomplete="off">

        <label>שם משפחה *</label>
        <input type="text" id="last_name" required autocomplete="off">

        <label>שם מלא</label>
        <input type="text" id="full_name" autocomplete="off" placeholder="אופציונלי...">

        <label>מין</label>
        <div class="gender-container">
            <label class="gender-option">
                <input type="radio" name="gender" value="ז">
                <span>זכר</span>
            </label>
            <label class="gender-option">
                <input type="radio" name="gender" value="נ">
                <span>נקבה</span>
            </label>
        </div>

        <label>תאריך לידה עברי</label>
        <input type="text" id="hebrew_date" placeholder="אופציונלי..." autocomplete="off">

        <label>שם ההורה (בן/בת של) *</label>
        <select id="son_of" required>
            <option value="" disabled selected>טוען רשימת הורים...</option>
        </select>

        <button type="submit" id="submitBtn">שמור ב-Neon</button>
    </form>
    <div id="statusMessage"></div>
</div>

<script>
    const parentSelect = document.getElementById('son_of');

    window.onload = async () => {
        try {
            const response = await fetch('/api/get-eligible-parents');
            if (!response.ok) throw new Error('נכשלה טעינת ההורים');
            const parents = await response.json(); 
            parentSelect.innerHTML = '<option value="" disabled selected>בחר הורה מהרשימה...</option>';
            parents.forEach(parent => {
                const option = document.createElement('option');
                option.value = parent.name;
                option.textContent = parent.name;
                parentSelect.appendChild(option);
            });
        } catch (err) {
            console.error(err);
            parentSelect.innerHTML = '<option value="" disabled selected>שגיאה בטעינת רשימת ההורים</option>';
        }
    };

    document.getElementById('familyForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMessage');
        
        btn.disabled = true;
        btn.innerText = 'שומר נתונים...';
        status.innerText = '';

        // אם לא נבחר אף לחצן רדיו של מין, נשלח null
        const genderRadio = document.querySelector('input[name="gender"]:checked');
        const selectedGender = genderRadio ? genderRadio.value : null;

        const payload = {
            first_name: document.getElementById('first_name').value.trim(),
            last_name: document.getElementById('last_name').value.trim(),
            full_name: document.getElementById('full_name').value.trim() || null,
            gender: selectedGender,
            hebrew_date: document.getElementById('hebrew_date').value.trim() || null,
            son_of: parentSelect.value
        };

        try {
            const response = await fetch('/api/add-member', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                status.style.color = '#4ed17d';
                status.innerText = result.message || 'החבר נשמר בהצלחה!';
                document.getElementById('familyForm').reset();
                parentSelect.value = ""; 
            } else {
                status.style.color = '#ff6b6b';
                status.innerText = result.error || 'חלה שגיאה בשמירה';
            }
        } catch (err) {
            status.style.color = '#ff6b6b';
            status.innerText = 'שגיאת תקשורת עם השרת';
        } finally {
            btn.disabled = false;
            btn.innerText = 'שמור ב-Neon';
        }
    };
</script>

</body>
</html>
