<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הוספת קרוב משפחה</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #2c3e50; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #2980b9; }
        #status { margin-top: 15px; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>הוספת קרוב משפחה</h2>
        <form id="csvForm">
            <input type="text" id="fName" placeholder="שם פרטי" required>
            <input type="text" id="lName" placeholder="שם משפחה" required>
            <button type="submit" id="submitBtn">שלח למאגר</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('csvForm').onsubmit = async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            const btn = document.getElementById('submitBtn');
            
            status.textContent = "שולח...";
            status.style.color = "black";
            btn.disabled = true;

            const payload = {
                firstName: document.getElementById('fName').value,
                lastName: document.getElementById('lName').value
            };

            try {
                const res = await fetch('/api/write-csv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    status.textContent = "✅ נשמר בהצלחה!";
                    status.style.color = "green";
                    document.getElementById('csvForm').reset();
                } else {
                    status.textContent = "❌ שגיאה: " + (data.error || "לא ידועה");
                    status.style.color = "red";
                }
            } catch (err) {
                status.textContent = "❌ שגיאת תקשורת - ה-API לא מגיב";
                status.style.color = "red";
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
