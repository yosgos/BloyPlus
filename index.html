<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הוספת נתונים למאגר המשפחתי</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5; 
        }
        .card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 100%;
            max-width: 400px; 
        }
        h2 { 
            text-align: center; 
            color: #1a73e8;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1rem;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer; 
            transition: background-color 0.2s;
        }
        button:hover { 
            background-color: #1557b0; 
        }
        #status { 
            margin-top: 20px; 
            text-align: center; 
            font-weight: 500;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>הוספת קרוב משפחה</h2>
        <form id="csvForm">
            <label for="field1">שם פרטי:</label>
            <input type="text" id="field1" placeholder="לדוגמה: משה" required>
            
            <label for="field2">שם משפחה:</label>
            <input type="text" id="field2" placeholder="לדוגמה: בלוי" required>
            
            <button type="submit">שלח למאגר ה-Master</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('csvForm').onsubmit = async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            
            // איפוס עיצוב הסטטוס
            status.style.color = "#555";
            status.textContent = "מעבד נתונים...";
            
            // הכנת הנתונים למשלוח
            const payload = {
                firstName: document.getElementById('field1').value.trim(),
                lastName: document.getElementById('field2').value.trim()
            };

            try {
                // שליחה ל-API שיצרנו ב-Vercel
                const res = await fetch('/api/write-csv', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();

                if (res.ok) {
                    status.style.color = "green";
                    status.textContent = "✅ נשמר בהצלחה בגיטהאב!";
                    document.getElementById('csvForm').reset();
                } else {
                    status.style.color = "red";
                    status.textContent = "❌ שגיאה: " + (result.error || "הפעולה נכשלה");
                }
            } catch (err) {
                status.style.color = "red";
                status.textContent = "❌ שגיאת תקשורת. ודא שהאתר מחובר.";
                console.error("Fetch error:", err);
            }
        };
    </script>
</body>
</html>
